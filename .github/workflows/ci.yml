name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Read by the settings mypy loads; nothing connects to it.
    env:
      DATABASE_URL: postgres://adforge:adforge@localhost:5432/adforge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # mypy only rechecks what changed since the cache was saved.
      - uses: actions/cache@v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-
      - run: uv run mypy .

  # The whole suite, split by file into 4 shards on 4 machines (tests/shards.py).
  backend-tests:
    runs-on: ubuntu-latest
    # A test that hangs, as a browser test can, fails the job instead of running for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adforge
          POSTGRES_PASSWORD: adforge
          POSTGRES_DB: adforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adforge"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://adforge:adforge@localhost:5432/adforge
      # A build of ffmpeg that can draw text and subtitles, and a font to draw them in.
      APT_PACKAGES: ffmpeg fonts-dejavu-core
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # The package files come from GitHub's cache: Ubuntu's mirror some days takes up to half
      # an hour to send them, and one slow shard holds up the whole run. The cache is kept per
      # runner image, since what an image already has decides which files the install needs.
      - id: runner-image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-packages
          key: apt-${{ steps.runner-image.outputs.name }}-${{ env.APT_PACKAGES }}
      - name: Install ffmpeg and its font
        env:
          CACHED: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          files=~/apt-packages
          # apt opens the files as root: its own user can't read the runner's home.
          as_root="-o APT::Sandbox::User=root"
          if [ "$CACHED" != true ]; then
            mkdir -p "$files/partial"
            # Each try keeps the files it got, so the next one carries on where it stopped.
            for try in 1 2 3; do
              sudo timeout 2m apt-get update &&
                sudo timeout 4m apt-get install -y --no-install-recommends --download-only \
                  $as_root -o Dir::Cache::Archives="$files" $APT_PACKAGES &&
                break
              if [ "$try" = 3 ]; then
                echo "::error::Ubuntu's package mirror didn't send $APT_PACKAGES in 3 tries. Re-run this job."
                exit 1
              fi
            done
            # Left behind by apt and readable only by root, they would stop the cache being saved.
            sudo rm -rf "$files/partial" "$files/lock"
          fi
          # Installed from the files alone, with every package source turned off: apt would
          # otherwise fetch the same packages from the mirror again. A file missing from the
          # cache fails the install instead.
          shopt -s nullglob
          debs=("$files"/*.deb)
          if [ ${#debs[@]} -gt 0 ]; then
            sudo apt-get install -y --no-install-recommends $as_root \
              -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts=/dev/null "${debs[@]}"
          fi
          ffmpeg -version | head -n 1
      - run: uv sync --frozen
      # The browser the marked screenshot's steps are tested in (tests/test_firecrawl_browser.py).
      # The runner image already has the system libraries it needs, so nothing comes from
      # Ubuntu's mirror here either.
      - run: uv run playwright install --only-shell chromium
      # One worker per core, each with its own test database; an idle worker takes tests
      # queued for a busy one.
      - run: uv run pytest -q -n auto --dist worksteal
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  # The one check to require: green only when the checks and every shard are.
  backend:
    if: always()
    needs: [backend-checks, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend-checks.result }}" = success && test "${{ needs.backend-tests.result }}" = success

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
